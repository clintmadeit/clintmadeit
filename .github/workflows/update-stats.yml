name: 📊 Update GitHub Stats

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main]

jobs:
  update-readme:
    name: Update README with latest stats
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify README exists
        run: |
          if [ ! -f README.md ]; then
            echo "❌ README.md not found"
            exit 1
          fi
          echo "✅ README.md found"
          wc -l README.md

      - name: Commit if changed
        run: |
          git config --local user.email "clintonbrirdley@gmail.com"
          git config --local user.name "clintmadeit"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: 📊 auto-update stats [skip ci]")

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
