name: 🔄 Sync New Repos to Profile

on:
  schedule:
    # Runs daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commits)'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync-repos:
    name: Fetch & update pinned project list
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch public repos from GitHub API
        id: fetch-repos
        run: |
          echo "Fetching repos for clintmadeit..."
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/users/clintmadeit/repos?sort=updated&per_page=10&type=public" \
            > repos.json

          echo "Found repos:"
          cat repos.json | node -e "
            const data = require('fs').readFileSync('/dev/stdin','utf8');
            const repos = JSON.parse(data);
            repos.forEach(r => console.log(\`  - \${r.name}: \${r.description || 'No description'}\`));
          "

      - name: Check for new repos since last run
        id: check-new
        run: |
          LAST_RUN_FILE=".github/last-sync.txt"
          LAST_RUN=$(cat $LAST_RUN_FILE 2>/dev/null || echo "2020-01-01T00:00:00Z")
          echo "Last sync: $LAST_RUN"

          NEW_COUNT=$(cat repos.json | node -e "
            const data = require('fs').readFileSync('/dev/stdin','utf8');
            const repos = JSON.parse(data);
            const lastRun = new Date('$LAST_RUN');
            const newRepos = repos.filter(r => new Date(r.created_at) > lastRun);
            console.log(newRepos.length);
            newRepos.forEach(r => console.log(\`NEW: \${r.name}\`));
          ")

          echo "new_repos=$NEW_COUNT" >> $GITHUB_OUTPUT
          echo "New repos since last sync: $NEW_COUNT"

          # Update last sync timestamp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > $LAST_RUN_FILE

      - name: Commit sync timestamp
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "clintonbrirdley@gmail.com"
          git config --local user.name "clintmadeit"
          git add .github/last-sync.txt || true
          git diff --staged --quiet || git commit -m "chore: 🔄 sync timestamp update [skip ci]"

      - name: Push changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Summary
        run: |
          echo "## Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🕐 Synced at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 New repos found: ${{ steps.check-new.outputs.new_repos }}" >> $GITHUB_STEP_SUMMARY
